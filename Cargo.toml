[package]
authors = ["Myles Pritchett"]
name = "ferisss"
version = "1.0.0"
edition = "2018"

repository = "https://github.com/MylesJPritchett/ferisss"
license = "MIT"

readme = "README.md"
keywords = ["battlesnake", "game-ai", "flood-fill", "rocket"]
description = "A Battlesnake that picks moves by measuring the open space behind each one"

[dependencies]
rocket = { version = "0.5.0", features = ["json"] }
serde = { version = "1.0.117", features = ["derive"] }
serde_json = "1.0.59"
log = "0.4.0"
env_logger = "0.9.0"
